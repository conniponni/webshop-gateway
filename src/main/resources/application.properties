spring.application.name=webshop-gateway
server.port=${PORT:9003}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
# Products
spring.cloud.gateway.server.webmvc.routes[0].id=products
spring.cloud.gateway.server.webmvc.routes[0].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/gateway/products/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=RemoveRequestHeader=Origin

# Orders
spring.cloud.gateway.server.webmvc.routes[1].id=orders
spring.cloud.gateway.server.webmvc.routes[1].uri=${ORDER_SERVICE_URL:http://localhost:9000}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/gateway/orders/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=RemoveRequestHeader=Origin
#
app.auth-server-url=${AUTH_SERVER_URL:http://localhost:8080}
app.cookie.secure=${COOKIE_SECURE:false}