spring.application.name=webshop-gateway
server.port=${PORT:9003}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Auth
spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVER_URL:http://localhost:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/gateway/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=RemoveRequestHeader=Origin

# Products
spring.cloud.gateway.server.webmvc.routes[1].id=products
spring.cloud.gateway.server.webmvc.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/gateway/products/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=RemoveRequestHeader=Origin

# Orders
spring.cloud.gateway.server.webmvc.routes[2].id=orders
spring.cloud.gateway.server.webmvc.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:9000}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/gateway/orders/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[2].filters[1]=RemoveRequestHeader=Origin
